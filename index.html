<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posts - Client API</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  form { display: grid; gap: .5rem; margin-bottom: 2rem; }
  input, textarea, button { padding: .5rem; font: inherit; }
  .post { border: 1px solid #ccc; border-radius: 6px; padding: .75rem; margin-bottom: .75rem; }
  .post h3 { margin: 0 0 .25rem; }
  .actions button { margin-right: .4rem; }
</style>
</head>
<body>
<h1>Posts</h1>

<form id="form">
  <input id="title" placeholder="Titre" required>
  <textarea id="body" placeholder="Contenu" required></textarea>
  <button type="submit" id="submitBtn">Ajouter</button>
</form>

<div id="list"></div>

<script>
const API = 'http://localhost:3000/api/posts';
const list = document.getElementById('list');
const form = document.getElementById('form');
const titleEl = document.getElementById('title');
const bodyEl = document.getElementById('body');
const submitBtn = document.getElementById('submitBtn');
let editingId = null; // null = mode création

async function loadPosts() {
  const res = await fetch(API);
  const posts = await res.json();
  list.replaceChildren();
  // On n'affiche que les 20 derniers pour rester lisible
  posts.slice(-20).reverse().forEach(renderPost);
}

function renderPost(p) {
  const div = document.createElement('div');
  div.className = 'post';

  // textContent (et pas innerHTML) -> pas de risque XSS
  const h = document.createElement('h3');
  h.textContent = `#${p.id} ${p.title}`;
  const para = document.createElement('p');
  para.textContent = p.body;

  const actions = document.createElement('div');
  actions.className = 'actions';
  const edit = document.createElement('button');
  edit.textContent = 'Modifier';
  edit.onclick = () => {
    editingId = p.id;
    titleEl.value = p.title;
    bodyEl.value = p.body;
    submitBtn.textContent = 'Enregistrer';
    titleEl.focus();
  };
  const del = document.createElement('button');
  del.textContent = 'Supprimer';
  del.onclick = async () => {
    await fetch(`${API}/${p.id}`, { method: 'DELETE' });
    loadPosts();
  };

  actions.append(edit, del);
  div.append(h, para, actions);
  list.appendChild(div);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = { userId: 1, title: titleEl.value, body: bodyEl.value };
  const url = editingId ? `${API}/${editingId}` : API;
  const method = editingId ? 'PUT' : 'POST';

  await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  editingId = null;
  submitBtn.textContent = 'Ajouter';
  form.reset();
  loadPosts();
});

loadPosts();
</script>
</body>
</html>
